name: BGP bypass

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bgp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Enabled registry, BGP session and persistence contracts
        run: go test -tags "with_bgp,with_prometheus" ./include ./service/bgpbypass
      - name: Disabled feature diagnostic
        run: go test ./include ./common/observability
      - name: Build with BGP
        run: go build -tags "with_bgp,with_prometheus" ./cmd/sing-box
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Race and contracts
        run: go test -race -tags "with_bgp,with_prometheus" . ./common/observability ./service/bgpbypass ./dns ./route ./route/rule ./include
      - name: Custom release and upstream merge safeguards
        run: |
          python3 .github/tests/test_release_scripts.py
          python3 .github/tests/test_upstream_pr.py
          bash -n .github/update_upstream_pr.sh
      - name: Prometheus without optional APIs
        run: go test -tags with_prometheus ./common/observability ./dns ./include
      - name: BGP without Prometheus
        run: go test -tags with_bgp ./common/observability ./service/bgpbypass ./include
      - name: Build and check documented example
        run: |
          go build -tags "with_bgp,with_prometheus" -o /tmp/sing-box-bgp ./cmd/sing-box
          /tmp/sing-box-bgp check -c docs/examples/bgp-bypass.json
          /tmp/sing-box-bgp schema > /tmp/bgp-schema.json
      - name: Compile Linux arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags "with_bgp,with_prometheus" -o /tmp/sing-box-bgp-arm64 ./cmd/sing-box
      - name: Missing build tag diagnostic
        run: |
          go build -tags with_prometheus -o /tmp/sing-box-no-bgp ./cmd/sing-box
          if /tmp/sing-box-no-bgp check -c docs/examples/bgp-bypass.json > /tmp/stub.log 2>&1; then exit 1; fi
          grep -q 'with_bgp' /tmp/stub.log
      - name: Missing Prometheus build tag diagnostic
        run: |
          go build -tags with_bgp -o /tmp/sing-box-no-prometheus ./cmd/sing-box
          if /tmp/sing-box-no-prometheus check -c docs/examples/bgp-bypass.json > /tmp/prometheus-stub.log 2>&1; then exit 1; fi
          grep -q 'with_prometheus' /tmp/prometheus-stub.log
      - name: DNS fuzz smoke
        run: go test ./service/bgpbypass -run '^$' -fuzz '^FuzzDNSLearning$' -fuzztime 10s
      - name: Microbenchmarks
        run: go test ./service/bgpbypass -run '^$' -bench . -benchmem
      - name: Install network test dependencies
        run: sudo apt-get update && sudo apt-get install -y frr iproute2 nftables python3-dnspython
      - name: Allow bgpd access to integration test files
        shell: bash
        run: |
          if [ -f /etc/apparmor.d/bgpd ]; then
            sudo install -d -m 0755 /etc/apparmor.d/local
            sudo tee -a /etc/apparmor.d/local/bgpd >/dev/null <<'EOF'
          /tmp/bgp-network-*/ r,
          /tmp/bgp-network-*/bgpd.conf r,
          /tmp/bgp-network-*/frr/ rw,
          /tmp/bgp-network-*/frr/bgpd.pid rwk,
          /tmp/bgp-network-*/frr/bgpd.vty rw,
          /tmp/bgp-network-*/frr/zserv.api rw,
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/bgpd
          fi
      - name: Namespace integration with FRR
        run: sudo python3 .github/tests/bgp_network.py /tmp/sing-box-bgp
      - name: Upload network diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-network-diagnostics
          path: /tmp/bgp-network-*/logs/*
          if-no-files-found: ignore
